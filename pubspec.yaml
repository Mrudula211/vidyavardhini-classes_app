name: vidyavardhini_classes
description: Coaching class management ERP for Vidyavardhini Classes.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Backend
  supabase_flutter: ^2.5.6

  # Routing
  go_router: ^13.2.5

  # Data classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local cache
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

  # Charts
  fl_chart: ^0.68.0

  # File handling
  file_picker: ^12.0.0-beta.7
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # PDF
  syncfusion_flutter_pdfviewer: ^34.1.31

  # Location / Geofence
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Maps
  google_maps_flutter: ^2.6.1

  # UI helpers
  shimmer: ^3.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.3
  package_info_plus: ^10.2.1
  flutter_svg: ^2.0.10+1
  dotted_border: ^2.1.0

  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.5
flutter:
  uses-material-design: true

  assets:
    - images/
    - images/logo.png
    - assets/fonts/Cinzel-Regular.ttf
    - assets/fonts/Cinzel-Bold.ttf

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
